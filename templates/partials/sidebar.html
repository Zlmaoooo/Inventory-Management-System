<div class="sidebar-brand">
    <a href="{% url 'dashboard' %}">
        <h1>INVENZA</h1>
    </a>
</div>

<nav class="sidebar-nav">
    <a href="{% url 'dashboard' %}" class="nav-item{% if request.path == '/dashboard/' or request.path == '/' %} active{% endif %}">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </a>
    <a href="{% url 'products' %}" class="nav-item{% if '/products/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>Products</span>
    </a>
    <a href="{% url 'inventory' %}" class="nav-item{% if '/inventory/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-warehouse"></i>
        <span>Inventory</span>
    </a>
    <a href="{% url 'transactions' %}" class="nav-item{% if '/transactions/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-right-left"></i>
        <span>Transactions</span>
    </a>
    <a href="{% url 'suppliers' %}" class="nav-item{% if '/suppliers/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-truck-field"></i>
        <span>Suppliers</span>
    </a>
    <a href="{% url 'reports' %}" class="nav-item{% if '/reports/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-file-lines"></i>
        <span>Reports</span>
    </a>
    {% if request.user.is_staff or request.user.is_superuser %}
    <a href="{% url 'users' %}" class="nav-item{% if '/users/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-users"></i>
        <span>Users</span>
    </a>
    <a href="{% url 'settings' %}" class="nav-item{% if '/settings/' in request.path %} active{% endif %}">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
    </a>
    {% endif %}
</nav>
