{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Invenza</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-brand">
                    <i class="fa-solid fa-boxes-stacked brand-icon"></i>
                    <h1>INVENZA</h1>
                </div>
                <p class="login-subtitle">Reset your password using the email on your account</p>
            </div>

            <form method="post" class="login-form">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="login-error-alert" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ form.non_field_errors }}</span>
                    </div>
                {% endif %}

                <div class="form-row">
                    <label for="id_email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" id="id_email" required autocomplete="email" placeholder="name@company.com" value="{{ form.email.value|default:'' }}">
                    </div>
                    {% if form.email.errors %}<div class="field-error">{{ form.email.errors }}</div>{% endif %}
                </div>

                <button type="submit" class="primary-btn login-btn">
                    <span>Send Reset Link</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-muted);">
                Remembered it? <a href="{% url 'landing' %}" style="color: var(--accent-color); font-weight: 600; text-decoration: underline;">Return to sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
