{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated | Invenza</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-brand">
                    <i class="fa-solid fa-boxes-stacked brand-icon"></i>
                    <h1>INVENZA</h1>
                </div>
                <p class="login-subtitle">Your password has been updated successfully</p>
            </div>

            <div class="login-error-alert" role="status" style="background-color: var(--success-bg); border-color: #bbf7d0; color: var(--success-text);">
                <i class="fa-solid fa-circle-check"></i>
                <span>You can now sign in with your new password.</span>
            </div>

            <div style="text-align: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-muted);">
                <a href="{% url 'landing' %}" style="color: var(--accent-color); font-weight: 600; text-decoration: underline;">Return to sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
