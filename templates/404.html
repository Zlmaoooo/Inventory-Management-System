{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | Invenza</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-container" style="max-width: 440px;">
        <div class="login-card" style="text-align: center;">
            <div style="font-size: 3rem; color: var(--accent-color); margin-bottom: 12px;">
                <i class="fa-solid fa-compass"></i>
            </div>
            
            <h1 style="font-size: 2.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">404</h1>
            <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">Page Not Found</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">The page you are looking for doesn't exist or has been moved.</p>
            
            <a href="{% url 'dashboard' %}" class="primary-btn" style="width: 100%; padding: 11px;">
                <i class="fa-solid fa-house"></i>
                <span>Return to Dashboard</span>
            </a>
        </div>
    </div>
</body>
</html>
